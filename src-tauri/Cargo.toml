[package]
name = "app"
version = "0.9.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-global-shortcut = "2.3.1"
tauri-plugin-notification = "2.3.3"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2.3.5"
tauri-plugin-updater = "2.10.1"
reqwest = { version = "0.12", features = ["rustls-tls"] }
tokio = { version = "1", features = ["time"] }

# Windows-only Win32 surface for the backend-child Job Object
# (JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE, see docs/adr/023). Version 0.60 matches
# the instance Tauri already resolves via `muda`, so cargo unifies it — extra
# features on an already-compiled crate, not a new build unit.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_Security",
] }
