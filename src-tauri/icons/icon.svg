<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    JustSay master brand mark — 1024×1024 source of truth.

    Design intent:
      • A rounded-square "tile" silhouette so the mark reads cleanly at every
        size, including 16×16 favicons and 32×32 system tray icons.
      • Subtle inner panel + glass highlight for depth at large sizes.
      • The interlocked J / S motif from the widget animation is the centerpiece;
        it shares one curve family so the two letters look like a single logogram.
      • Microphone-style audio mark sits below the J / S, doubling as the J's
        tittle when scaled down (so it never looks empty in small sizes).
      • Two gradients — primary indigo→cyan for the mark, secondary pink→amber
        for the audio motif — match the in-app widget animation states.
      • All strokes round-capped, line-widths tuned to survive 16×16 rasterisation.
  -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#1f1b3a" />
      <stop offset="100%" stop-color="#0d0e22" />
    </linearGradient>
    <linearGradient id="mark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#7b73ff" />
      <stop offset="55%"  stop-color="#5fa4ff" />
      <stop offset="100%" stop-color="#4cc9f0" />
    </linearGradient>
    <linearGradient id="hot-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#ff5ea0" />
      <stop offset="100%" stop-color="#ffae3c" />
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="40%" r="60%">
      <stop offset="0%"   stop-color="#7b73ff" stop-opacity="0.55" />
      <stop offset="60%"  stop-color="#7b73ff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#7b73ff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.10" />
      <stop offset="55%"  stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Reusable mark — exposed via id so HTML can <use href="#mark"> -->
    <symbol id="mark" viewBox="-32 -32 64 64">
      <!-- S — top half, sweeping left-to-right then back -->
      <path d="M -14 -10
               C -8 -16, 8 -16, 14 -10
               C 20 -4, -2 0, 14 6
               C 20 12, 8 16, -8 12"
            fill="none" stroke="url(#mark-grad)" stroke-width="3.5"
            stroke-linecap="round" stroke-linejoin="round" />
      <!-- J — vertical stem, descender curls to mirror the S's tail -->
      <path d="M 6 -14 L 6 8 C 6 14, -2 16, -8 12"
            fill="none" stroke="url(#mark-grad)" stroke-width="3.5"
            stroke-linecap="round" stroke-linejoin="round" />
      <!-- Tittle on the J — also reads as a "voice dot" -->
      <circle cx="6" cy="-18" r="2.6" fill="url(#mark-grad)" />
    </symbol>
  </defs>

  <!-- Tile background -->
  <rect x="0" y="0" width="1024" height="1024" rx="220" ry="220" fill="url(#bg-grad)" />

  <!-- Soft halo behind the centerpiece -->
  <circle cx="512" cy="448" r="380" fill="url(#halo)" />

  <!-- Decorative orbit rings -->
  <circle cx="512" cy="512" r="380" fill="none" stroke="url(#mark-grad)"
          stroke-width="3" stroke-dasharray="6 16" opacity="0.35" />
  <circle cx="512" cy="512" r="320" fill="none" stroke="url(#mark-grad)"
          stroke-width="2" stroke-dasharray="3 10" opacity="0.22" />

  <!-- Main mark — scaled up from the symbol -->
  <g transform="translate(512 470)">
    <g transform="scale(11.5)">
      <use href="#mark" x="-32" y="-32" width="64" height="64" />
    </g>
  </g>

  <!-- Audio bars under the mark — fixed at idle pose (master file is static) -->
  <g transform="translate(512 820)">
    <rect x="-180" y="-22" width="32" height="44"  rx="14" fill="url(#hot-grad)" />
    <rect x="-110" y="-44" width="32" height="88"  rx="14" fill="url(#hot-grad)" />
    <rect x="-40"  y="-62" width="32" height="124" rx="14" fill="url(#hot-grad)" />
    <rect x="30"   y="-44" width="32" height="88"  rx="14" fill="url(#hot-grad)" />
    <rect x="100"  y="-22" width="32" height="44"  rx="14" fill="url(#hot-grad)" />
  </g>

  <!-- Top gloss for tile depth (above content, below ring) -->
  <rect x="40" y="40" width="944" height="500" rx="190" ry="190" fill="url(#sheen)" />

  <!-- Outer rim hairline -->
  <rect x="6" y="6" width="1012" height="1012" rx="216" ry="216"
        fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2" />
</svg>
