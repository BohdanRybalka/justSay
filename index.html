<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JustSay Settings</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="stylesheet" href="/src/settings/settings.css" />
</head>
<body>
  <div id="app" class="app">
    <nav class="sidebar">
      <div class="sidebar-header">
        <img class="brand-logo" src="/icon.svg" width="22" height="22" alt="" aria-hidden="true" />
        <span>JustSay</span>
      </div>
      <ul class="sidebar-nav">
        <li><button class="nav-btn active" data-tab="general">General</button></li>
        <li><button class="nav-btn" data-tab="models">Models</button></li>
        <li><button class="nav-btn" data-tab="audio">Audio</button></li>
        <li><button class="nav-btn" data-tab="transcribe">Transcribe</button></li>
        <li><button class="nav-btn" data-tab="storage">Storage</button></li>
        <li><button class="nav-btn" data-tab="history">History</button></li>
        <li><button class="nav-btn" data-tab="metrics">Metrics</button></li>
        <li><button class="nav-btn" data-tab="words">Words</button></li>
      </ul>
      <div class="sidebar-footer">
        <span class="version" id="app-version">v0.1.0</span>
      </div>
    </nav>

    <main class="content">
      <div id="tab-content"></div>
      <footer class="status-bar">
        <span id="backend-status" class="status-indicator offline">Backend: Offline</span>
      </footer>
    </main>
  </div>

  <script type="module" src="/src/settings/settings.ts"></script>
</body>
</html>
