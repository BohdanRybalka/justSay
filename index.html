<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JustSay</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="stylesheet" href="/src/ui/tokens.css" />
  <link rel="stylesheet" href="/src/ui/fonts.css" />
  <link rel="stylesheet" href="/src/ui/base.css" />
  <link rel="stylesheet" href="/src/ui/controls.css" />
  <link rel="stylesheet" href="/src/settings/settings.css" />
  <link rel="stylesheet" href="/src/settings/shell/titlebar.css" />
  <link rel="stylesheet" href="/src/settings/shell/sidebar.css" />
  <link rel="stylesheet" href="/src/settings/shell/pane.css" />
</head>
<body>
  <header id="titlebar" class="titlebar"></header>
  <div id="app" class="app">
    <nav id="sidebar" class="sidebar" aria-label="Sections">
      <button type="button" class="account-row" data-panel="account" aria-current="false">
        <span class="avatar"></span>
        <span class="account-row-name">Account</span>
        <svg class="icon" aria-hidden="true"><use href="#chev"/></svg>
      </button>
      <div class="sidebar-separator"></div>
      <button type="button" class="nav-item" data-panel="insights" aria-current="true"><svg class="icon" aria-hidden="true"><use href="#chart"/></svg>Insights</button>
      <button type="button" class="nav-item" data-panel="history" aria-current="false"><svg class="icon" aria-hidden="true"><use href="#clock"/></svg>History</button>
      <button type="button" class="nav-item" data-panel="dictation" aria-current="false"><svg class="icon" aria-hidden="true"><use href="#sliders"/></svg>Dictation</button>
      <button type="button" class="nav-item" data-panel="settings" aria-current="false"><svg class="icon" aria-hidden="true"><use href="#cog"/></svg>Settings</button>
      <div id="sidebar-status" class="sidebar-status sidebar-status--starting">
        <span class="sidebar-status-dot"></span>
        <span class="sidebar-status-text">Starting…</span>
        <span class="sidebar-status-separator">·</span>
        <span id="sidebar-version" class="num">v…</span>
      </div>
    </nav>
    <main id="pane" class="pane"></main>
  </div>

  <script type="module" src="/src/settings/settings.ts"></script>
</body>
</html>
