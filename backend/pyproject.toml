[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "justsay-backend"
version = "0.1.0"
description = "JustSay AI Engine — voice processing backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.9",
    "pyperclip>=1.9.0",
    "psutil>=5.9.0",
    "sqlite-vec==0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-randomly>=3.15.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
    "vulture==2.16",
]
cloud = [
    "google-genai>=1.0.0",
    "groq>=0.15.0",
]
local = [
    "faster-whisper>=1.1.0",
]
local-llm = [
    "ollama>=0.6.1",
]
audio = [
    "sounddevice>=0.5.0",
    "soundfile>=0.12.0",
    "numpy>=1.26.0",
    "soxr>=0.5.0",
    "pyaudiowpatch>=0.2.12.8; sys_platform == 'win32'",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-p no:randomly"
testpaths = ["tests"]
markers = [
    "prewarm: tests for maybe_prewarm_local/ensure_local_ready dispatch (opt out of the autouse fixture that no-ops maybe_prewarm_local)",
    "background_indexer: tests for vector_store.run_background_indexer itself (opt out of the autouse fixture that no-ops it)",
    "no_factory_stub: tests that must see the real app.stt.local_factory — those asserting on the cost of calling it, and those exercising a platform branch of it (opt out of the autouse fixture that stubs get_local_provider_class/get_local_provider_kind)",
    "no_vad_stub: tests for the spec-033 neural VAD pipeline layer (opt out of the autouse fixture that pins analyze_vad to None)",
    "slow: multi-second tests — real train-audio-data/ sample sweeps, spec-033 lock-contention/concurrency pins, and spec-034 gate-latency pins (ADR 020). -m 'not slow' drops all three, including the regression pins, not just the sweeps",
]

[tool.vulture]
paths = ["app"]
min_confidence = 100
ignore_names = ["time_info", "status", "frame_count"]
