[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "justsay-backend"
version = "0.1.0"
description = "JustSay AI Engine — voice processing backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.9",
    "pyperclip>=1.9.0",
    "psutil>=5.9.0",
    # Pinned exact (not floor-only): sqlite-vec's KNN query syntax
    # (`WHERE embedding MATCH ? AND k = ?`) is version-sensitive across its
    # own releases — verified against 0.1.9 specifically at implementation
    # time (see ADR 001 / spec 003 Risks).
    "sqlite-vec==0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
    "vulture==2.16",
]
cloud = [
    "google-genai>=1.0.0",
    "groq>=0.15.0",
]
local = [
    "faster-whisper>=1.1.0",
]
local-mac = [
    # macOS Apple Silicon (M1+): MLX/Metal-accelerated Whisper. Pulls torch
    # (~2 GB) transitively for spectrogram preprocessing. <1.0 upper bound
    # guards against private-API drift in mlx_whisper.transcribe.ModelHolder.
    "mlx-whisper>=0.4.0,<1.0",
]
local-llm = [
    # Optional: only needed for the standalone /llm/process endpoint in local mode.
    # The default audio pipeline no longer runs an LLM cleanup step.
    "ollama>=0.6.1",
]
audio = [
    "sounddevice>=0.5.0",
    "soundfile>=0.12.0",
    "numpy>=1.26.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
# Pre-existing-debt ignore list (spec 039 / ADR 025). The backend violates these
# 13 rules in code that predates the PR-CI ruff gate; cleaning them is a rename-
# heavy, import-order-fragile repo-wide edit deferred to its own spec. The gate
# still enforces `select` MINUS these — every other E/F/I/N/W/UP rule is live.
# Each entry is cleared by deleting its line as the debt for that rule clears
# (a ratchet that only tightens). "ruff passes" here means "no violation outside
# these 13 tracked-debt rules", NOT "the backend is ruff-clean".
ignore = [
    "E501",  # line-too-long (42) — long SQL/log/annotation lines
    "E402",  # module-import-not-at-top (16) — tests/conftest.py ordering (ADR 014)
    "E702",  # multiple-statements-on-one-line-semicolon (2)
    "F401",  # unused-import (5)
    "F821",  # undefined-name (1) — quoted type-only "NoReturn" in scripts/smoke_sidecar.py, never evaluated
    "I001",  # unsorted-imports (35) — reordering ties into the conftest E402 ordering
    "N801",  # invalid-class-name (3) — renames public classes
    "N806",  # non-lowercase-variable-in-function (4)
    "N818",  # error-suffix-on-exception-name (1) — renames an exception type
    "UP017", # datetime-timezone-utc (7)
    "UP037", # quoted-annotation (5)
    "UP041", # timeout-error-alias (1)
    "UP042", # replace-str-enum (4) — StrEnum migration of public enums
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "mlx: tests for MLXWhisperSTTProvider (opt out of the autouse fixture that forces the LocalSTTProvider path)",
    "prewarm: tests for maybe_prewarm_local/ensure_local_ready dispatch (opt out of the autouse fixture that no-ops maybe_prewarm_local)",
    "background_indexer: tests for vector_store.run_background_indexer itself (opt out of the autouse fixture that no-ops it)",
    "no_factory_stub: tests asserting on the cost of calling app.stt.local_factory (opt out of the autouse fixture that stubs get_local_provider_class/get_local_provider_kind)",
    "no_vad_stub: tests for the spec-033 neural VAD pipeline layer (opt out of the autouse fixture that pins analyze_vad to None)",
    "slow: multi-second tests — real train-audio-data/ sample sweeps, spec-033 lock-contention/concurrency pins, and spec-034 gate-latency pins (ADR 020). -m 'not slow' drops all three, including the regression pins, not just the sweeps",
]

[tool.vulture]
paths = ["app"]
min_confidence = 100
ignore_names = ["time_info"]
