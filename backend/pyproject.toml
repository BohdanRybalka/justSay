[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "justsay-backend"
version = "0.1.0"
description = "JustSay AI Engine — voice processing backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.9",
    "pyperclip>=1.9.0",
    "psutil>=5.9.0",
    # Pinned exact (not floor-only): sqlite-vec's KNN query syntax
    # (`WHERE embedding MATCH ? AND k = ?`) is version-sensitive across its
    # own releases — verified against 0.1.9 specifically at implementation
    # time (see ADR 001 / spec 003 Risks).
    "sqlite-vec==0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
]
cloud = [
    "google-genai>=1.0.0",
    "groq>=0.15.0",
]
local = [
    "faster-whisper>=1.1.0",
]
local-mac = [
    # macOS Apple Silicon (M1+): MLX/Metal-accelerated Whisper. Pulls torch
    # (~2 GB) transitively for spectrogram preprocessing. <1.0 upper bound
    # guards against private-API drift in mlx_whisper.transcribe.ModelHolder.
    "mlx-whisper>=0.4.0,<1.0",
]
local-llm = [
    # Optional: only needed for the standalone /llm/process endpoint in local mode.
    # The default audio pipeline no longer runs an LLM cleanup step.
    "ollama>=0.6.1",
]
audio = [
    "sounddevice>=0.5.0",
    "soundfile>=0.12.0",
    "numpy>=1.26.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "mlx: tests for MLXWhisperSTTProvider (opt out of the autouse fixture that forces the LocalSTTProvider path)",
    "prewarm: tests for maybe_prewarm_local/ensure_local_ready dispatch (opt out of the autouse fixture that no-ops maybe_prewarm_local)",
    "background_indexer: tests for vector_store.run_background_indexer itself (opt out of the autouse fixture that no-ops it)",
]
