# Cross-platform release build for JustSay (Plan 008).
#
# Triggered on git tag pushes (v*). Builds the PyInstaller sidecar per platform,
# then runs `tauri build` which embeds it as `bundle.externalBin` and produces
# the .msi (Windows) and .dmg (macOS arm64) artifacts.
#
# Code signing is OPT-IN: the workflow looks for repository secrets
# (WIN_AZURE_TS_*, MACOS_NOTARIZE_*) and only runs the signing/notarization
# steps when they exist. Without secrets you still get unsigned installers,
# fine for local testing.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            sidecar_ext: .exe
          - platform: macos-14 # arm64 Apple Silicon runner
            target: aarch64-apple-darwin
            sidecar_ext: ""

    runs-on: ${{ matrix.platform }}

    # Job-level env so `if:` on individual steps can read it.
    # `secrets` context is NOT available inside step-level `if:` reliably, and
    # a step's own `env:` block is invisible to its own `if:` (eval order).
    env:
      HAS_APPLE_CERT: ${{ secrets.MACOS_NOTARIZE_CERT != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      # Windows: actions/setup-python is fine here — the loadable-sqlite-
      # extensions problem below is macOS-only.
      - name: Install Python (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # macOS: actions/setup-python's macOS CPython (>= 3.11.0-rc.2) is built
      # WITHOUT --enable-loadable-sqlite-extensions by design (actions/setup-
      # python#540 — won't-fix, no toggle exists), so sqlite3.Connection has no
      # enable_load_extension and sqlite-vec (semantic search) cannot load — the
      # "Verify sqlite-vec loads in frozen sidecar" step below is exactly what
      # caught this on the first release to run it. uv's python-build-standalone
      # sets PY_SQLITE_ENABLE_LOAD_EXTENSION=1, so use it for the macOS
      # interpreter that pip + PyInstaller run against. The venv (built --seed so
      # it carries pip) goes on PATH, so every later step's python/pip/pyinstaller
      # resolves to it and PyInstaller freezes THAT interpreter. arm64 is
      # preserved (uv installs the arm64 build on macos-14). Windows is untouched.
      - name: Install uv (macOS)
        if: runner.os == 'macOS'
        uses: astral-sh/setup-uv@v6

      - name: Install Python via uv (macOS)
        if: runner.os == 'macOS'
        run: |
          uv python install 3.12
          uv venv --python 3.12 --seed "$GITHUB_WORKSPACE/.venv"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"

      # Fail fast (~1s, both OSes) BEFORE the multi-minute pip + PyInstaller build
      # if the interpreter on PATH lacks loadable-extension support. Prints
      # sys.executable so a wrong-Python-on-PATH pickup is obvious in the log.
      - name: Assert loadable sqlite extensions are available
        run: |
          python -c "import sqlite3, sys; c = sqlite3.connect(':memory:'); assert hasattr(c, 'enable_load_extension'), 'CPython built WITHOUT loadable sqlite extensions: ' + sys.executable; print('OK loadable-extensions:', sys.executable)"

      - name: Install Python deps + PyInstaller
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[cloud,audio]"
          pip install pyinstaller

      # TEN VAD neural silence gate (spec 033 / ADR 019). Windows-only: it is
      # the only platform this project ships the prebuilt library for (no
      # macOS hardware exists here to verify a framework bundle against).
      # MUST run BEFORE the PyInstaller step — build_sidecar.spec bundles the
      # DLL only when backend/vendor/ten-vad/ already exists, and tolerates
      # its absence so from-source builds still work. That tolerance is
      # exactly why the post-build assertion below is not optional.
      - name: Fetch TEN VAD library (Windows)
        if: runner.os == 'Windows'
        run: python backend/scripts/fetch_ten_vad.py

      - name: Build PyInstaller sidecar
        working-directory: backend
        run: pyinstaller --clean --noconfirm build_sidecar.spec

      # Mirrors the sqlite-vec precedent: assert the shipped artifact
      # actually contains the DLL, so a regression in the fetch step (or a
      # silently changed upstream layout) fails the release loudly instead
      # of shipping a Windows build whose neural VAD is quietly inert.
      - name: Verify TEN VAD bundled in frozen sidecar (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          DLL="backend/dist/justsay-backend/_internal/ten_vad/ten_vad.dll"
          if [ ! -f "$DLL" ]; then
            echo "ERROR: $DLL missing — the Windows sidecar would ship without the neural VAD."
            exit 1
          fi
          echo "OK: $DLL present ($(wc -c < "$DLL") bytes)"

      # Mirrors the v0.8.0 local-3.10 smoke matrix against the CI-built
      # 3.12 artifact: bind-test port 9377, launch the frozen sidecar,
      # poll /health for {"status":"ok"}, then assert 200 on /resources,
      # /settings, /settings/cloud-status, /audio/status. Stdlib-only —
      # runs before any test extra is installed.
      - name: Smoke test sidecar
        run: python backend/scripts/smoke_sidecar.py --host 127.0.0.1 --port 9377

      # Permanent CI assertion that sqlite-vec loads inside the actual
      # frozen sidecar binary on this platform — closes the macOS
      # `enable_load_extension` question ADR 001 / spec 003 opened
      # (Windows was verified manually in an earlier session; this makes
      # both platforms verified on every release, not just once). Runs the
      # real shipped artifact, not the CI runner's own Python. A failure
      # here stops the release build before any installer is produced.
      - name: Verify sqlite-vec loads in frozen sidecar
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            BIN="backend/dist/justsay-backend/justsay-backend.exe"
          else
            BIN="backend/dist/justsay-backend/justsay-backend"
          fi
          "$BIN" --selftest-sqlite-vec

      - name: Copy onedir bundle to Tauri resources
        shell: bash
        run: |
          mkdir -p src-tauri/resources
          cp -r "backend/dist/justsay-backend" "src-tauri/resources/"

      # --- whisper.cpp + Vulkan (spec 018) — Windows AMD/Intel STT accel ---
      # Windows-only: macOS Apple Silicon builds the same whisper-server with
      # the Metal backend instead, in the macOS leg further below (spec 068).
      # Both legs are gated — these steps all carry
      # `if: runner.os == 'Windows'`, the Metal ones `== 'macOS'`.
      # Same pinned tag/-DGGML_VULKAN=ON recipe as
      # backend/scripts/build_whisper_cpp_vulkan.ps1's local dev build, so
      # CI and local verification never drift onto different whisper.cpp
      # versions — see docs/adr/011-whisper-cpp-vulkan-stt-provider.md.
      - name: Install Vulkan SDK
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@37effcfa045411f8bfbbda26df2fd1b3bf3436fa # v1.6.0
        with:
          # No vulkan_version pin -- Vulkan's API/ABI is stable across SDK
          # releases (unlike whisper.cpp's own git tag, this doesn't need
          # lockstep reproducibility); the action's SHA pin above is what
          # matters for supply-chain reproducibility.
          install_runtime: true
          cache: true
          stripdown: true

      # No separate "set up MSVC env" action needed here: the script below
      # locates vswhere.exe / vcvars64.bat / cmake / ninja itself (same
      # self-contained detection used for local dev) rather than depending
      # on an ambient Developer Command Prompt shell.
      - name: Build whisper.cpp with Vulkan backend
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\backend\scripts\build_whisper_cpp_vulkan.ps1

      - name: Copy whisper.cpp-Vulkan binary to Tauri resources
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p src-tauri/resources/whisper-cpp-vulkan
          cp backend/vendor/whisper-cpp-vulkan/* src-tauri/resources/whisper-cpp-vulkan/

      # --- whisper.cpp + Metal (spec 068) — macOS Apple Silicon STT accel ---
      # macOS-only counterpart to the Vulkan leg above. No SDK to install:
      # the Metal framework ships with the Xcode Command Line Tools already
      # present on the runner, and the script pins the same whisper.cpp tag
      # as build_whisper_cpp_vulkan.ps1 (enforced by
      # backend/tests/test_build_definitions.py). Before this leg existed the
      # shipped macOS app had no Local-mode engine at all — see
      # docs/adr/036-one-whisper-cpp-server-provider-for-both-platforms.md.
      - name: Build whisper.cpp with Metal backend
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bash backend/scripts/build_whisper_cpp_metal.sh

      - name: Copy whisper.cpp-Metal binary to Tauri resources
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p src-tauri/resources/whisper-cpp-metal
          cp backend/vendor/whisper-cpp-metal/* src-tauri/resources/whisper-cpp-metal/

      # --- Core Audio system-audio tap (spec 074) — macOS meeting recording ---
      # macOS has no input device that carries the system's own output, so
      # meeting recording needs this native helper to hold the
      # NSAudioCaptureUsageDescription permission and hand raw PCM back to the
      # Python sidecar. No CI job compiles Swift — a tag push is the first and
      # only place this builds, so the step is deliberately not tolerant: no
      # `|| true`, no `continue-on-error`. A compile error must fail the release
      # rather than ship a macOS bundle whose meeting recording is inert.
      - name: Build macOS system-audio tap helper
        if: runner.os == 'macOS'
        shell: bash
        run: bash backend/scripts/build_macos_audio_tap.sh

      - name: Copy system-audio tap helper to Tauri resources
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p src-tauri/resources
          cp macos/JustSayAudioTap/.build/release/justsay-audiotap src-tauri/resources/justsay-audiotap

      # Mirrors the TEN VAD / sqlite-vec precedent: assert the shipped tree
      # actually contains the helper, so a silently changed build output path
      # fails here instead of producing a signed bundle that cannot record.
      - name: Verify system-audio tap helper bundled
        if: runner.os == 'macOS'
        shell: bash
        run: |
          HELPER="src-tauri/resources/justsay-audiotap"
          if [ ! -x "$HELPER" ]; then
            echo "ERROR: $HELPER missing — the macOS build would ship without system-audio capture."
            exit 1
          fi
          echo "OK: $HELPER present ($(wc -c < "$HELPER") bytes)"

      - name: Install npm deps
        run: npm ci

      # Export Apple signing env ONLY when the cert secret is non-empty.
      # Previously these were set unconditionally; an empty `APPLE_CERTIFICATE`
      # made `security import` fail with "One or more parameters... were not valid".
      # When the secret is missing tauri-action now sees no APPLE_* env at all
      # and gracefully skips signing — producing an unsigned .app, which is
      # what we want until Plan 008 Phase B (paid Apple Developer onboarding).
      #
      # Multi-line secret values (base64 .p12 certs commonly have newlines every
      # 76 chars) require the heredoc form for $GITHUB_ENV — a plain
      # `echo "KEY=VALUE"` truncates at the first newline and treats the rest
      # as separate shell commands. The `EOF<n>` per-key delimiter pattern
      # below is the GitHub-documented multi-line-safe idiom.
      - name: Export Apple signing env (if cert secret is set)
        if: runner.os == 'macOS' && env.HAS_APPLE_CERT == 'true'
        shell: bash
        env:
          MACOS_NOTARIZE_CERT: ${{ secrets.MACOS_NOTARIZE_CERT }}
          MACOS_NOTARIZE_CERT_PASSWORD: ${{ secrets.MACOS_NOTARIZE_CERT_PASSWORD }}
          MACOS_NOTARIZE_IDENTITY: ${{ secrets.MACOS_NOTARIZE_IDENTITY }}
          MACOS_NOTARIZE_APPLE_ID: ${{ secrets.MACOS_NOTARIZE_APPLE_ID }}
          MACOS_NOTARIZE_APP_PASSWORD: ${{ secrets.MACOS_NOTARIZE_APP_PASSWORD }}
          MACOS_NOTARIZE_TEAM_ID: ${{ secrets.MACOS_NOTARIZE_TEAM_ID }}
        run: |
          write_kv () {
            local key="$1"
            local value="$2"
            local delim
            delim="EOF_$(uuidgen | tr -d '-')"
            {
              echo "${key}<<${delim}"
              printf '%s\n' "${value}"
              echo "${delim}"
            } >> "$GITHUB_ENV"
          }
          write_kv APPLE_CERTIFICATE          "$MACOS_NOTARIZE_CERT"
          write_kv APPLE_CERTIFICATE_PASSWORD "$MACOS_NOTARIZE_CERT_PASSWORD"
          write_kv APPLE_SIGNING_IDENTITY     "$MACOS_NOTARIZE_IDENTITY"
          write_kv APPLE_ID                   "$MACOS_NOTARIZE_APPLE_ID"
          write_kv APPLE_PASSWORD             "$MACOS_NOTARIZE_APP_PASSWORD"
          write_kv APPLE_TEAM_ID              "$MACOS_NOTARIZE_TEAM_ID"

      - name: Build Tauri app
        # Pinned to a specific SHA (resolved from the `v0` tag on 2026-05-11)
        # rather than the floating tag. The `latest.json` updater manifest
        # schema is sensitive to tauri-action's output format; a silent
        # bump would break in-app updates for every existing install.
        # When updating, regenerate via
        #   gh api repos/tauri-apps/tauri-action/git/refs/tags/v0 --jq '.object.sha'
        # and verify the updater manifest shape against
        # https://v2.tauri.app/plugin/updater/ before merging.
        uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4
        env:
          # Required by tauri-action to create / upload the draft release.
          # Without it the build succeeds but the publish step fails with
          # "Error: GITHUB_TOKEN is required". GITHUB_TOKEN is provided
          # automatically by Actions — no extra secret needed.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri auto-update signing (Ed25519, NOT a code-signing cert).
          # Without these set, tauri-action skips writing the .sig files
          # alongside the installers and the updater plugin in the app
          # will reject every check() call as "no signature found".
          # Generate locally with: npx tauri signer generate -w ~/.tauri/justsay.key
          # then upload private key + password as the two secrets below.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # bundle.resources lives statically in tauri.conf.json now —
          # `"resources/justsay-backend": "justsay-backend"` — so both
          # local `tauri build` and CI produce installers that ship the
          # sidecar. The previous TAURI_CONFIG runtime injection silently
          # dropped the directory because Tauri 2.10's bundler did not
          # recognise the path as a resource without the static config.
          # The directory form (no `/**/*` glob) is what preserves the
          # nested `_internal/` structure PyInstaller --onedir needs; a
          # glob version flattened every file into the destination root
          # and broke the bootloader.
          # `tauri dev` ignores bundle.resources, so the missing
          # `src-tauri/resources/justsay-backend/` dir does not break dev.
          # Apple signing env vars are exported by the previous step when
          # MACOS_NOTARIZE_CERT secret is non-empty. Until Plan 008 Phase B,
          # those secrets are unset → unsigned .app is the expected output.
          # Windows: Azure Trusted Signing wires in as a separate step
          # (Plan 008 Phase B, $10/mo onboarding).
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "JustSay ${{ github.ref_name }}"
          releaseBody: "See `docs/release-notes/` for what changed."
          releaseDraft: true
          prerelease: false
          # Publish the Tauri 2.x updater manifest (latest.json) next to
          # the installer artifacts. The NSIS variant is what the Windows
          # build uploads; macOS .app.tar.gz signing also goes through
          # this path. Without this, tauri-action only writes the .sig
          # files and the updater plugin has no manifest URL to fetch.
          updaterJsonPreferNsis: true

