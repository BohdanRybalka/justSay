# Cross-platform release build for JustSay (Plan 008).
#
# Triggered on git tag pushes (v*). Builds the PyInstaller sidecar per platform,
# then runs `tauri build` which embeds it as `bundle.externalBin` and produces
# the .msi (Windows) and .dmg (macOS arm64) artifacts.
#
# Code signing is OPT-IN: the workflow looks for repository secrets
# (WIN_AZURE_TS_*, MACOS_NOTARIZE_*) and only runs the signing/notarization
# steps when they exist. Without secrets you still get unsigned installers,
# fine for local testing.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            sidecar_ext: .exe
          - platform: macos-14 # arm64 Apple Silicon runner
            target: aarch64-apple-darwin
            sidecar_ext: ""

    runs-on: ${{ matrix.platform }}

    # Job-level env so `if:` on individual steps can read it.
    # `secrets` context is NOT available inside step-level `if:` reliably, and
    # a step's own `env:` block is invisible to its own `if:` (eval order).
    env:
      HAS_APPLE_CERT: ${{ secrets.MACOS_NOTARIZE_CERT != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps + PyInstaller
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[cloud,audio]"
          pip install pyinstaller

      - name: Build PyInstaller sidecar
        working-directory: backend
        run: pyinstaller --clean --noconfirm build_sidecar.spec

      # Mirrors the v0.8.0 local-3.10 smoke matrix against the CI-built
      # 3.12 artifact: bind-test port 9377, launch the frozen sidecar,
      # poll /health for {"status":"ok"}, then assert 200 on /resources,
      # /settings, /settings/cloud-status, /audio/status. Stdlib-only —
      # runs before any test extra is installed.
      - name: Smoke test sidecar
        run: python backend/scripts/smoke_sidecar.py --host 127.0.0.1 --port 9377

      - name: Copy onedir bundle to Tauri resources
        shell: bash
        run: |
          mkdir -p src-tauri/resources
          cp -r "backend/dist/justsay-backend" "src-tauri/resources/"

      - name: Install npm deps
        run: npm ci

      # Export Apple signing env ONLY when the cert secret is non-empty.
      # Previously these were set unconditionally; an empty `APPLE_CERTIFICATE`
      # made `security import` fail with "One or more parameters... were not valid".
      # When the secret is missing tauri-action now sees no APPLE_* env at all
      # and gracefully skips signing — producing an unsigned .app, which is
      # what we want until Plan 008 Phase B (paid Apple Developer onboarding).
      #
      # Multi-line secret values (base64 .p12 certs commonly have newlines every
      # 76 chars) require the heredoc form for $GITHUB_ENV — a plain
      # `echo "KEY=VALUE"` truncates at the first newline and treats the rest
      # as separate shell commands. The `EOF<n>` per-key delimiter pattern
      # below is the GitHub-documented multi-line-safe idiom.
      - name: Export Apple signing env (if cert secret is set)
        if: runner.os == 'macOS' && env.HAS_APPLE_CERT == 'true'
        shell: bash
        env:
          MACOS_NOTARIZE_CERT: ${{ secrets.MACOS_NOTARIZE_CERT }}
          MACOS_NOTARIZE_CERT_PASSWORD: ${{ secrets.MACOS_NOTARIZE_CERT_PASSWORD }}
          MACOS_NOTARIZE_IDENTITY: ${{ secrets.MACOS_NOTARIZE_IDENTITY }}
          MACOS_NOTARIZE_APPLE_ID: ${{ secrets.MACOS_NOTARIZE_APPLE_ID }}
          MACOS_NOTARIZE_APP_PASSWORD: ${{ secrets.MACOS_NOTARIZE_APP_PASSWORD }}
          MACOS_NOTARIZE_TEAM_ID: ${{ secrets.MACOS_NOTARIZE_TEAM_ID }}
        run: |
          write_kv () {
            local key="$1"
            local value="$2"
            local delim
            delim="EOF_$(uuidgen | tr -d '-')"
            {
              echo "${key}<<${delim}"
              printf '%s\n' "${value}"
              echo "${delim}"
            } >> "$GITHUB_ENV"
          }
          write_kv APPLE_CERTIFICATE          "$MACOS_NOTARIZE_CERT"
          write_kv APPLE_CERTIFICATE_PASSWORD "$MACOS_NOTARIZE_CERT_PASSWORD"
          write_kv APPLE_SIGNING_IDENTITY     "$MACOS_NOTARIZE_IDENTITY"
          write_kv APPLE_ID                   "$MACOS_NOTARIZE_APPLE_ID"
          write_kv APPLE_PASSWORD             "$MACOS_NOTARIZE_APP_PASSWORD"
          write_kv APPLE_TEAM_ID              "$MACOS_NOTARIZE_TEAM_ID"

      - name: Build Tauri app
        # Pinned to a specific SHA (resolved from the `v0` tag on 2026-05-11)
        # rather than the floating tag. The `latest.json` updater manifest
        # schema is sensitive to tauri-action's output format; a silent
        # bump would break in-app updates for every existing install.
        # When updating, regenerate via
        #   gh api repos/tauri-apps/tauri-action/git/refs/tags/v0 --jq '.object.sha'
        # and verify the updater manifest shape against
        # https://v2.tauri.app/plugin/updater/ before merging.
        uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4
        env:
          # Required by tauri-action to create / upload the draft release.
          # Without it the build succeeds but the publish step fails with
          # "Error: GITHUB_TOKEN is required". GITHUB_TOKEN is provided
          # automatically by Actions — no extra secret needed.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri auto-update signing (Ed25519, NOT a code-signing cert).
          # Without these set, tauri-action skips writing the .sig files
          # alongside the installers and the updater plugin in the app
          # will reject every check() call as "no signature found".
          # Generate locally with: npx tauri signer generate -w ~/.tauri/justsay.key
          # then upload private key + password as the two secrets below.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # bundle.resources lives statically in tauri.conf.json now —
          # `"resources/justsay-backend": "justsay-backend"` — so both
          # local `tauri build` and CI produce installers that ship the
          # sidecar. The previous TAURI_CONFIG runtime injection silently
          # dropped the directory because Tauri 2.10's bundler did not
          # recognise the path as a resource without the static config.
          # The directory form (no `/**/*` glob) is what preserves the
          # nested `_internal/` structure PyInstaller --onedir needs; a
          # glob version flattened every file into the destination root
          # and broke the bootloader.
          # `tauri dev` ignores bundle.resources, so the missing
          # `src-tauri/resources/justsay-backend/` dir does not break dev.
          # Apple signing env vars are exported by the previous step when
          # MACOS_NOTARIZE_CERT secret is non-empty. Until Plan 008 Phase B,
          # those secrets are unset → unsigned .app is the expected output.
          # Windows: Azure Trusted Signing wires in as a separate step
          # (Plan 008 Phase B, $10/mo onboarding).
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "JustSay ${{ github.ref_name }}"
          releaseBody: "See `docs/release-notes/` for what changed."
          releaseDraft: true
          prerelease: false
          # Publish the Tauri 2.x updater manifest (latest.json) next to
          # the installer artifacts. The NSIS variant is what the Windows
          # build uploads; macOS .app.tar.gz signing also goes through
          # this path. Without this, tauri-action only writes the .sig
          # files and the updater plugin has no manifest URL to fetch.
          updaterJsonPreferNsis: true

