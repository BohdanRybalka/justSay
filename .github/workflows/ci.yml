# PR-gating CI (spec 030 / 039, ADR 017 / 025).
#
# Five per-check jobs run in parallel — each check routes through an npm
# script so CI and a local run share one definition (ADR 017's
# single-definition rule):
#
#   frontend-lint — Node only: knip (dead code) + tsc --noEmit. Grouped like
#                   backend-lint below: both are static analysis, neither runs
#                   the app. A frontend-lint failure needs the job log to tell
#                   knip from tsc apart — same trade-off backend-lint already
#                   accepts for ruff vs. vulture.
#   frontend-test — Node only: vitest.
#   backend-lint  — Node entry point + Python[dev]: ruff + vulture.
#   backend-test  — Node entry point + Python[dev,audio,cloud]: pytest.
#   shell-test    — Node entry point + Rust, on a windows-latest + macos-14
#                   matrix: cargo test. Added by spec 151; see its own comment
#                   block at the job for why both legs are required.
#
# backend-lint installs only backend[dev] and skips PortAudio: neither ruff nor
# vulture imports the app. Both backend jobs drop `npm ci` — their npm scripts
# are all `cd backend && python -m …` with no node_modules binary dependency.
# npm + pip caching is on for every job that installs deps, to offset the extra
# per-job setup the split re-pays.
#
# Still deliberately a subset of the local Stage 2 gate: no PyInstaller
# sidecar, no Vulkan SDK, and pytest runs `-m "not slow"` so the hardware-less
# runner skips the timing-sensitive pins. ADR 025 excluded Rust from this gate
# and named the trigger for adding it; spec 151 adds it on the user's decision
# of 2026-09-11 that every layer's tests run on every pull request. See
# docs/adr/025-pr-ci-gate-scope-and-exclusions.md for the rest of the subset
# (no coverage gate) and docs/adr/017-static-analysis-in-pr-ci.md for why these
# checks live in a PR workflow rather than a pre-commit hook or subagent step.

name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install npm deps
        run: npm ci

      - name: Run dead-code check (knip)
        run: npm run lint:dead-code:ts

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

  frontend-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install npm deps
        run: npm ci

      - name: Run frontend tests (vitest)
        run: npm run test:frontend

  # Static analysis over backend/app — ruff + vulture, both fast and neither
  # imports the app, so this job installs only backend[dev] (no audio extra, no
  # libportaudio2) and skips `npm ci` (npm is only the entry point for the
  # `cd backend && python -m …` scripts).
  backend-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/uv.lock

      # Pinned rather than floating: this binary is what judges the lock's
      # freshness, so it is bumped deliberately together with the lock it
      # writes (same version as the dev machine's uv).
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.10"

      # Names the cause up front: this exits 1 when backend/pyproject.toml has
      # changed since backend/uv.lock was generated. The install step below
      # would fail on the same staleness anyway (`uv export --locked` exits 2)
      # and prints the same "run `uv lock`" text, so what this buys is a named
      # step in the job log instead of a red install step.
      - name: Check the dependency lock is fresh
        working-directory: backend
        run: uv lock --check

      # Installs the one recorded resolution instead of resolving pyproject's
      # ranges afresh on every run (ADR 056). `uv export` only reads the lock,
      # so it needs no environment of its own; `--no-deps` on the editable
      # install is what stops pip re-resolving what the lock already pinned.
      - name: Install backend deps
        working-directory: backend
        run: |
          uv export --locked --format requirements.txt --extra dev --no-dev --no-emit-project --no-hashes -o requirements-locked.txt
          pip install -r requirements-locked.txt --no-deps
          pip install -e . --no-deps

      - name: Run ruff (lint)
        run: npm run lint:ruff

      - name: Run dead-code check (vulture)
        run: npm run lint:dead-code:py

  backend-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/uv.lock

      # Pinned rather than floating: this binary is what judges the lock's
      # freshness, so it is bumped deliberately together with the lock it
      # writes (same version as the dev machine's uv).
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.10"

      # PortAudio is a runtime dependency of `sounddevice`, imported at module
      # load in backend/app/audio/recorder.py and reached at pytest collection
      # via app.main. Installed proactively so collection resolves regardless of
      # whether the sounddevice Linux wheel bundles PortAudio; harmless if it does.
      - name: Install PortAudio
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      # The cloud extra the script names is here for the gates, not for the
      # app: without google-genai installed, the Gemini timeout tests either
      # skip outright or fall back to a sys.modules stub that accepts any
      # keyword, so CI verified neither Gemini acceptance criterion while
      # reporting green.
      # Byte-identical to the `backend:install` npm script, so it routes
      # through it rather than keeping a second copy of the same definition
      # (ADR 017). The script does its own `cd backend`; Node is set up above.
      - name: Install backend deps
        run: npm run backend:install

      - name: Run backend tests (pytest, not slow)
        run: npm run test -- -m "not slow"

      # Order-independence gate (JS-96). The suite was green only because
      # alphabetical collection happened to put test_api.py after
      # test_data_isolation.py, whose TestClient(app) lifespan populates
      # app.state.recorder; renaming any test file would have turned master red.
      # pytest-randomly is pinned OFF by default in pyproject.toml so the run
      # above stays deterministic and so does everyone's local run -- it is
      # re-enabled here only. No -q: that suppresses pytest's header, and the
      # header is where the chosen seed is printed. The first run of this gate
      # failed without recording its seed for exactly that reason -- though the
      # order dependency it caught (JS-110) needed a specific pair of tests
      # rather than a specific seed, and reproduced in seconds without one.
      - name: Run backend tests in a randomised order
        run: cd backend && python -m pytest tests/ -m "not slow" -p randomly

  # The Rust shell (spec 151). It starts the engine, owns the tray and the
  # global shortcut, so a break here is a dead app rather than a degraded one —
  # yet until now `cargo` appeared in no PR workflow and the suite ran for the
  # first time on a tag push.
  #
  # A matrix rather than one runner: of the 30 tests in the `app_lib` binary, 7
  # are `#[cfg(windows)]` (the Job Object kill-on-close pair, the pid-assign
  # non-fatality, the three timing budgets and the force-kill path from ADR
  # 023/024), so Windows runs 30 and macOS runs 23. Both legs are required —
  # CLAUDE.md forbids making either platform non-fatal. Toolchain setup and the
  # cache key shape are copied from release.yml deliberately, so the two
  # workflows do not drift into two ways of building the same crate.
  #
  # macOS needs no system dependency beyond what the runner image ships:
  # release.yml installs none for its own Rust build either.
  shell-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-14 # arm64 Apple Silicon runner
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      # `tauri-build` resolves every bundle resource path at compile time and
      # fails the build script with "resource path ... doesn't exist" when one
      # is missing. All of them are produced by a release build (the PyInstaller
      # sidecar, the whisper.cpp binaries, the macOS audio tap) and all are
      # gitignored, so a clean checkout carries none. Empty placeholders satisfy
      # the path check; this job compiles and runs tests, it bundles nothing.
      - name: Create placeholder bundle resources
        shell: bash
        run: |
          mkdir -p src-tauri/resources/justsay-backend
          mkdir -p src-tauri/resources/whisper-cpp-vulkan
          mkdir -p src-tauri/resources/whisper-cpp-metal
          touch src-tauri/resources/justsay-audiotap

      # Routed through the npm script so CI and a local run share one definition
      # (ADR 017); no `npm ci` — the script is a bare `cd src-tauri && cargo
      # test` and needs no node_modules binary.
      - name: Run shell tests (cargo test)
        run: npm run test:rust
