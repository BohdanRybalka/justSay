<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JustSay Widget</title>
  <link rel="stylesheet" href="/src/widget/widget.css" />
</head>
<body>
  <div id="widget" class="widget idle">
    <img class="widget-logo" src="/src/widget/logo.png" alt="" width="18" height="18" />
    <div class="widget-dot" id="dot"></div>
    <div class="widget-content">
      <span class="widget-text" id="widget-text">JustSay</span>
      <span class="widget-duration" id="widget-duration"></span>
    </div>
    <div class="widget-marquee" id="widget-marquee">
      <span class="marquee-inner" id="marquee-inner"></span>
    </div>
  </div>

  <script type="module" src="/src/widget/widget.ts"></script>
</body>
</html>
