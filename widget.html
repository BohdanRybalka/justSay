<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JustSay Widget</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="stylesheet" href="/src/widget/widget.css" />
</head>
<body>
  <div id="widget" class="widget idle">
    <svg class="widget-logo" viewBox="0 0 64 64" width="28" height="28" aria-hidden="true">
      <defs>
        <linearGradient id="w-grad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#7b73ff" />
          <stop offset="100%" stop-color="#4cc9f0" />
        </linearGradient>
        <linearGradient id="w-grad-hot" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ff5ea0" />
          <stop offset="100%" stop-color="#ffae3c" />
        </linearGradient>
        <radialGradient id="w-halo" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#7b73ff" stop-opacity="0.55" />
          <stop offset="100%" stop-color="#7b73ff" stop-opacity="0" />
        </radialGradient>
      </defs>
      <circle class="js-halo" cx="32" cy="32" r="28" fill="url(#w-halo)" />
      <circle class="js-orbit" cx="32" cy="32" r="26" fill="none"
              stroke="url(#w-grad)" stroke-width="1" stroke-dasharray="2 6" />
      <g transform="translate(32 32)">
        <g class="js-mark">
          <path class="js-stroke js-s"
                d="M -14 -10 C -8 -16, 8 -16, 14 -10 C 20 -4, -2 0, 14 6 C 20 12, 8 16, -8 12"
                fill="none" stroke="url(#w-grad)" stroke-width="3.5"
                stroke-linecap="round" stroke-linejoin="round" />
          <path class="js-stroke js-j"
                d="M 6 -14 L 6 8 C 6 14, -2 16, -8 12"
                fill="none" stroke="url(#w-grad)" stroke-width="3.5"
                stroke-linecap="round" stroke-linejoin="round" />
          <circle class="js-dot" cx="6" cy="-18" r="2.6" fill="url(#w-grad)" />
        </g>
      </g>
      <g class="js-bars" transform="translate(32 50)">
        <rect class="js-bar js-bar-1" x="-14" y="-3" width="2.5" height="6" rx="1.25" fill="url(#w-grad-hot)" />
        <rect class="js-bar js-bar-2" x="-9"  y="-5" width="2.5" height="10" rx="1.25" fill="url(#w-grad-hot)" />
        <rect class="js-bar js-bar-3" x="-4"  y="-7" width="2.5" height="14" rx="1.25" fill="url(#w-grad-hot)" />
        <rect class="js-bar js-bar-4" x="1"   y="-5" width="2.5" height="10" rx="1.25" fill="url(#w-grad-hot)" />
        <rect class="js-bar js-bar-5" x="6"   y="-3" width="2.5" height="6" rx="1.25" fill="url(#w-grad-hot)" />
        <rect class="js-bar js-bar-6" x="11"  y="-2" width="2.5" height="4" rx="1.25" fill="url(#w-grad-hot)" />
      </g>
    </svg>
    <div class="widget-content">
      <span class="widget-text" id="widget-text">JustSay</span>
      <span class="widget-duration" id="widget-duration"></span>
    </div>
    <div class="widget-marquee" id="widget-marquee">
      <span class="marquee-inner" id="marquee-inner"></span>
    </div>
    <div class="widget-route" id="widget-route" aria-live="polite"></div>
  </div>

  <script type="module" src="/src/widget/widget.ts"></script>
</body>
</html>
